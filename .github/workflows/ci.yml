name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-test-secret-key
      DATABASE_URL: sqlite:///ci_test.db
      FLASK_APP: app.py

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile check (catches syntax errors)
        run: python -m py_compile $(find . -name "*.py" -not -path "./venv/*")

      - name: App import smoke test
        run: python -c "import app; print('IMPORT_OK')"

      - name: Migrations apply cleanly to a fresh database
        run: flask db upgrade
