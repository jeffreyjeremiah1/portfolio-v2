<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>{% block title %}Admin{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body class="bg-light">

<div class="container-fluid">

    <div class="row">

        <nav class="col-md-3 col-lg-2 bg-dark text-white min-vh-100 p-4">

            <h3 class="mb-4">

                <i class="fa-solid fa-code"></i>

                Admin

            </h3>

            <div class="nav flex-column">

                <a class="nav-link mb-2
                    {% if request.endpoint == 'admin.dashboard' %}
                        active fw-bold bg-primary rounded text-white
                    {% else %}
                        text-white
                    {% endif %}"
                    href="{{ url_for('admin.dashboard') }}">

                    <i class="fa-solid fa-chart-line me-2"></i>

                    Dashboard

                </a>

                <a class="nav-link mb-2
                    {% if request.endpoint == 'admin.projects' %}
                        active fw-bold bg-primary rounded text-white
                    {% else %}
                        text-white
                    {% endif %}"
                    href="{{ url_for('admin.projects') }}">

                    <i class="fa-solid fa-folder me-2"></i>

                    Projects

                </a>

                <a class="nav-link mb-2
                    {% if request.endpoint == 'admin.add_project' %}
                        active fw-bold bg-primary rounded text-white
                    {% else %}
                        text-white
                    {% endif %}"
                    href="{{ url_for('admin.add_project') }}">

                    <i class="fa-solid fa-folder-plus me-2"></i>

                    Add Project

                </a>

                <a class="nav-link mb-2
                    {% if request.endpoint == 'admin.tags' %}
                        active fw-bold bg-primary rounded text-white
                    {% else %}
                        text-white
                    {% endif %}"
                    href="{{ url_for('admin.tags') }}">

                    <i class="fa-solid fa-tags me-2"></i>

                    Tags

                </a>

                <a class="nav-link mb-2
                    {% if request.endpoint == 'admin.testimonials' %}
                        active fw-bold bg-primary rounded text-white
                    {% else %}
                        text-white
                    {% endif %}"
                    href="{{ url_for('admin.testimonials') }}">

                    <i class="fa-solid fa-quote-left me-2"></i>

                    Testimonials

                </a>

                <a class="nav-link mb-2
                    {% if request.endpoint == 'admin.posts' %}
                        active fw-bold bg-primary rounded text-white
                    {% else %}
                        text-white
                    {% endif %}"
                    href="{{ url_for('admin.posts') }}">

                    <i class="fa-solid fa-blog me-2"></i>

                    Blog Posts

                </a>

                <a class="nav-link mb-2
                    {% if request.endpoint == 'admin.messages' %}
                        active fw-bold bg-primary rounded text-white
                    {% else %}
                        text-white
                    {% endif %}"
                    href="{{ url_for('admin.messages') }}">

                    <i class="fa-solid fa-inbox me-2"></i>

                    Messages

                </a>

                <hr>

                <a class="nav-link text-white"
                   href="{{ url_for('public.home') }}">

                    <i class="fa-solid fa-globe me-2"></i>

                    View Portfolio

                </a>

                <a class="nav-link text-white"
                    href="{{ url_for('admin.profile') }}">

                    <i class="fa-solid fa-user me-2"></i>
                    Profile

                </a>

                <a class="nav-link text-white"
                    href="{{ url_for('admin.settings') }}">

                        <i class="fa-solid fa-gear me-2"></i>
                        Settings

                </a>

                <a class="nav-link text-danger"
                   href="{{ url_for('auth.logout') }}">

                    <i class="fa-solid fa-right-from-bracket me-2"></i>

                    Logout

                </a>

            </div>

        </nav>

        <main class="col-md-9 col-lg-10 p-5">

            {% include "partials/flash_messages.html" %}

            {% block content %}
            {% endblock %}

        </main>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

    setTimeout(() => {

        document.querySelectorAll(".alert").forEach(alert => {

            const bsAlert = bootstrap.Alert.getOrCreateInstance(alert);

            bsAlert.close();

        });

    }, 3000);

});
</script>

</body>

</html>
