{% extends "base.html" %}

{% block title %}

Dashboard

{% endblock %}

{% block content %}

<div class="container py-5">

<h1 class="mb-4">

Project Dashboard

</h1>

<a href="{{ url_for('admin.add_project') }}"
   class="btn btn-primary mb-4">
    Add Project
</a>

<table class="table table-dark table-striped">

    <thead>

        <tr>

            <th>ID</th>

            <th>Title</th>

            <th>GitHub</th>

            <th>Demo</th>

            <th>Actions</th>

        </tr>

    </thead>

    <tbody>

    {% for project in projects %}

        <tr>

            <td>{{ project.id }}</td>

            <td>{{ project.title }}</td>

            <td>{{ project.github }}</td>

            <td>{{ project.demo }}</td>

            <td>

                <a href="{{ url_for('admin.edit_project', id=project.id) }}"
                   class="btn btn-warning btn-sm">
                    Edit
                </a>

                <form method="POST"
                      action="{{ url_for('admin.delete_project', id=project.id) }}"
                      style="display:inline;"
                      onsubmit="return confirm('Delete this project?');">

                    <button class="btn btn-danger btn-sm">
                        Delete
                    </button>

                </form>

            </td>

        </tr>

    {% endfor %}

    </tbody>

</table>

</div>

{% endblock %}
